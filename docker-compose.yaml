services:
  deps:
    image: urmom:deps
    profiles: ["deps"]
    build:
      context: .
      dockerfile: deps/Dockerfile
      target: deps

  urmom:
    build:
      context: .
      dockerfile: Dockerfile
      target: execute
      args:
        DEPS_IMAGE: urmom:deps
    image: urmom:latest
    environment:
      TZ: UTC
      DB_URL: /app/data/urmom.db
      PORT: "50051"
      LOAD_SAMPLE_DATA: "1"
    ports:
      - "50051:50051"
    volumes:
      - data:/app/data
    restart: unless-stopped

volumes:
  data:
